<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Home SIEM lab architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="360" rx="12" fill="#ffffff"/>
  <rect x="16" y="16" width="868" height="328" rx="10" fill="none" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="32" y="42" font-size="14" fill="#64748b">VMware Workstation · virtual network 192.168.95.0/24</text>

  <!-- Kali -->
  <rect x="40" y="110" width="210" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="145" y="145" text-anchor="middle" font-size="18" font-weight="600" fill="#991b1b">Kali Linux</text>
  <text x="145" y="168" text-anchor="middle" font-size="13" fill="#7f1d1d">192.168.95.132</text>
  <text x="145" y="200" text-anchor="middle" font-size="13" fill="#7f1d1d">Attacker</text>
  <text x="145" y="220" text-anchor="middle" font-size="13" fill="#7f1d1d">NetExec (SMB brute force)</text>

  <!-- Windows -->
  <rect x="345" y="90" width="230" height="190" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="125" text-anchor="middle" font-size="18" font-weight="600" fill="#1e3a8a">Windows 11 (win-lab)</text>
  <text x="460" y="148" text-anchor="middle" font-size="13" fill="#1e3a8a">192.168.95.131</text>
  <text x="460" y="180" text-anchor="middle" font-size="13" fill="#1e3a8a">Target</text>
  <text x="460" y="200" text-anchor="middle" font-size="13" fill="#1e3a8a">Atomic Red Team (local techniques)</text>
  <text x="460" y="220" text-anchor="middle" font-size="13" fill="#1e3a8a">Sysmon · Security · PowerShell logs</text>
  <text x="460" y="240" text-anchor="middle" font-size="13" fill="#1e3a8a">Wazuh agent</text>

  <!-- Wazuh -->
  <rect x="660" y="110" width="200" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="760" y="145" text-anchor="middle" font-size="18" font-weight="600" fill="#14532d">Ubuntu</text>
  <text x="760" y="168" text-anchor="middle" font-size="13" fill="#14532d">192.168.95.130</text>
  <text x="760" y="200" text-anchor="middle" font-size="13" fill="#14532d">Wazuh all-in-one</text>
  <text x="760" y="220" text-anchor="middle" font-size="13" fill="#14532d">manager · indexer · dashboard</text>

  <!-- arrows -->
  <line x1="250" y1="185" x2="341" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="296" y="174" text-anchor="middle" font-size="12" fill="#334155">SMB 445</text>

  <line x1="575" y1="185" x2="656" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="616" y="174" text-anchor="middle" font-size="12" fill="#334155">events</text>
  <text x="616" y="206" text-anchor="middle" font-size="12" fill="#334155">TCP 1514</text>

  <text x="450" y="320" text-anchor="middle" font-size="13" fill="#64748b">Analyst views alerts in the Wazuh dashboard from a browser on win-lab</text>
</svg>
